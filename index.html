<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagoya Doubles Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--ink:#f4efe9;--mute:#a59a8f;--line:#2e2620;--card:#141010;--acc:#ff7a1a;--deload:#ffc247;--warn:#ffa85c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif;padding:20px 16px 60px}
main{max-width:680px;margin:0 auto}
h1{font:700 34px/1.05 "Barlow Semi Condensed",sans-serif;margin:0 0 4px;color:var(--acc)}
h2{font:700 22px/1.2 "Barlow Semi Condensed",sans-serif;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 20px}
.pick{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:10px;padding:16px;margin-bottom:16px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid var(--acc);color:var(--acc);margin-bottom:8px}
.tag.d{border-color:var(--deload);color:var(--deload)}
.target{font:700 20px "Barlow Semi Condensed",sans-serif;color:var(--acc);margin:4px 0 10px}
ul{margin:0;padding-left:20px}li{margin:4px 0}
.note{color:var(--mute);font-size:14px;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.spl{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
button{font:600 15px Barlow,sans-serif;border:0;border-radius:6px;padding:10px 16px;background:var(--acc);color:#000;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sug{margin-top:10px;font-weight:600;color:var(--warn)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--acc);font-weight:600}
td:nth-child(3),td:nth-child(5){white-space:normal}
</style>
</head>
<body>
<main>
<h1>Nagoya doubles plan</h1>
<p class="sub">Pro Doubles, Nagoya 16-18 April 2027. Week 1 starts Monday 19 October 2026.</p>
<div class="pick">
<div><label for="day">Day</label><select id="day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Sunday</option></select></div>
<div><label for="wk">Week</label><select id="wk"></select></div>
</div>
<section id="out" class="card" aria-live="polite"></section>
<section class="card">
<h2>Log this session</h2>
<div class="row">
<div id="cwrap"><label for="cnt">Number of runs or reps</label><input id="cnt" type="number" min="1" max="12"></div>
<div><label for="rpe">Effort (1-10)</label><input id="rpe" type="number" min="1" max="10"></div>
</div>
<div id="spl" class="spl"></div>
<div class="row">
<div id="twrap"><label for="tot">Total time (Thursday, optional)</label><input id="tot" placeholder="1:18:30"></div>
<div><label for="nt">Notes</label><input id="nt" placeholder="Lunges felt heavy"></div>
</div>
<div class="row" id="swrap"><div style="grid-column:1/-1"><label for="st">Station times (optional)</label><input id="st" placeholder="Sled push 1:20, sled pull 1:45, burpees 4:10"></div></div>
<div class="btns"><button id="save">Save result</button></div>
<div id="sug" class="sug" role="status"></div>
<div class="tw"><table id="log"></table></div>
<div class="btns"><button class="g" id="copy">Copy log</button><button class="g" id="clr">Clear log</button></div>
<p class="note">Results are saved in this browser only. Use Copy log to paste them into a chat with Claude and rework the next weeks' paces.</p>
</section>
</main>
<script>
const START=new Date(2026,9,19);
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const PH=[["Rebuild",1,8],["Build",9,16],["Race-specific",17,23],["Taper",24,25],["Race week",26,26]];
const DEL=[4,8,12,16,20];
const OUT={
 1:["Phase 1 outline: intervals 4:30 to 4:20 per km.","Phase 2 outline: intervals 4:20 to 4:10 per km.","Phase 3 outline: 1km reps around 4:05-4:10 per km.","Taper: shorter race-pace touches only.","Nagoya, 16-18 April. Keep it easy, sleep, and trust the work."],
 2:["Phase 1 outline: runs between stations 4:50 to 4:30 per km. First benchmark in week 6 (solo full sim, full Pro weights).","Phase 2 outline: runs 4:30 to 4:15 per km. Fortnightly partner sessions begin. Solo benchmark in week 14.","Phase 3 outline: runs 4:15 to 4:00-4:05 per km. Weekly doubles sims. Full doubles sim in week 19, half sim in week 22.","Taper: volume down about 30%, then 50%.","Nagoya, 16-18 April."]};
const W=[
{n:6,t:"6 x 1km",r:[270,278],s:["6 x 1km @ 4:30-4:38/km","90 sec easy jog between reps"]},
{n:7,t:"7 x 1km",r:[260,270],s:["7 x 1km @ 4:20-4:30/km","Rep 1 no faster than 4:20; finish within about 5 sec of rep 1","75 sec easy jog between reps"]},
{n:8,t:"8 x 1km",r:[257,267],s:["8 x 1km @ 4:17-4:27/km","75 sec easy jog between reps"]},
{n:5,t:"5 x 1km (deload)",r:[262,272],s:["5 x 1km @ 4:22-4:32/km","90 sec easy jog between reps"]},
{n:3,t:"3 x 2km",r:[258,266],s:["3 x 2km @ 4:18-4:26/km","2 min easy jog between reps","Longer reps run a touch slower, so the range is not copied straight from the 1km reps"]},
{n:6,t:"6 x 1km",r:[252,260],s:["6 x 1km @ 4:12-4:20/km","75 sec easy jog between reps","Shortened because Thursday this week is the first solo benchmark"]}];
const TH=[
{n:4,t:"Weak-station rounds",r:[280,290],s:["4 rounds, 90 sec rest between rounds:","1km run @ 4:40-4:50/km","25 wall balls @ 9kg","25m sandbag lunges @ ~95% Pro weight","20m burpee broad jumps","Totals: 100 wall balls, 100m lunges, 80m burpee broad jumps"]},
{n:4,t:"Half sim, stations 5-8",r:[275,290],s:["1km run, Row 1000m","1km run, Farmers Carry 200m","1km run, Sandbag Lunges 100m @ ~95% Pro weight","1km run, Wall Balls 100 reps","Runs @ 4:35-4:50/km"]},
{n:5,t:"Half sim, stations 1-4",r:[275,285],s:["1km run, Ski Erg 1000m","1km run, Sled Push 50m @ Pro weight","1km run, Sled Pull 50m @ Pro weight","1km run, Burpee Broad Jumps 80m, 1km run","Runs @ 4:35-4:45/km, no faster than 4:35. Sleds and burpees are heart-rate heavy, so protect them with the runs.","Log your sled and burpee times"]},
{n:3,t:"Technique deload",r:null,s:["3 rounds:","800m run, moderate effort","15 wall balls, 15m lunges, 10m burpee broad jumps","About 35 min total"]}];
const dsel=document.getElementById("day"),wsel=document.getElementById("wk"),out=document.getElementById("out"),cnt=document.getElementById("cnt"),spl=document.getElementById("spl"),sug=document.getElementById("sug");
const $=id=>document.getElementById(id);
const OFF={Monday:0,Tuesday:1,Wednesday:2,Thursday:3,Sunday:6};
const LIFT={Monday:["Bench or DB press: 4 x 6-8, rest 2 min","Weighted pull-up or lat pulldown: 4 x 6-8, rest 2 min","Standing overhead press: 3 x 8, rest 90 sec","Single-arm row: 3 x 10 each side, rest 60 sec","Chest-supported DB row (incline bench): 3 x 10, rest 90 sec","Farmers carry: 3 x 40m, heavy, rest 90 sec","Wall balls: 4 x 15 @ 9kg, unbroken sets, rest 90 sec","Pallof press: 3 x 10 each side, rest 45 sec"],
Wednesday:["Squat variation: 3 x 6 @ RPE 7-8, rest 2-3 min","RDL: 3 x 8, rest 2 min","Split squat or step-up: 3 x 8 each leg, rest 90 sec","Single-leg glute bridge, foot on bench: 3 x 10 each leg, rest 60 sec","Leg curl: 2 x 12, rest 60 sec","Calf raise: 3 x 12, rest 45-60 sec","Dead bugs: 3 x 10, rest 45 sec"]};
const SUN=["12-14","12-14","12-14","10","12-14","12-14","12-14","10","14","15","15","10","15","16","16","10","15","16, last 2-3km moderate","16","10","16, last 2-3km moderate","15","14, last 2-3km moderate","12","8",""];
const fmt=d=>d.getDate()+" "+MON[d.getMonth()].slice(0,3);
const phase=n=>PH.find(p=>n>=p[1]&&n<=p[2])[0];
const dayDate=(n,day)=>{const d=new Date(START);d.setDate(d.getDate()+7*(n-1)+OFF[day]);return d.getDate()+" "+MON[d.getMonth()]};
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;");
for(let n=1;n<=26;n++){const d=new Date(START);d.setDate(d.getDate()+7*(n-1));const o=document.createElement("option");o.value=n;o.textContent="Week "+n+" ("+fmt(d)+") "+phase(n);wsel.appendChild(o)}
const cur=()=>({n:+wsel.value,day:dsel.value});
const wk=()=>{const{n,day}=cur();const a=day=="Tuesday"?W:day=="Thursday"?TH:[];return a[n-1]||null};
function sec(s){const m=String(s).trim().match(/^(\d+):(\d{2})$/);return m?+m[1]*60+ +m[2]:null}
function mmss(x){return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
function boxes(){const day=dsel.value;let L;
 if(day=="Sunday")L=[["Distance (km)","14"],["Average pace (min:sec per km)","6:20"],["Average heart rate (optional)","135"]];
 else if(LIFT[day])L=LIFT[day].map(x=>[x.split(":")[0],"60kg 4x8"]);
 else{const c=Math.max(1,Math.min(12,+cnt.value||1));L=[];for(let i=1;i<=c;i++)L.push(["Run "+i,"4:31"])}
 spl.innerHTML="";L.forEach((x,i)=>{const d=document.createElement("div");d.innerHTML='<label for="s'+i+'">'+x[0]+'</label><input class="sp" id="s'+i+'" placeholder="'+x[1]+'">';spl.appendChild(d)})}
function plan(){const{n,day}=cur();const run=day=="Tuesday"||day=="Thursday";const w=wk();const del=DEL.includes(n)?'<span class="tag d">Deload week</span>':"";
 let h='<span class="tag">'+phase(n)+'</span> '+del+"<h2>"+day+" "+dayDate(n,day)+", week "+n+"</h2>";
 const li=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
 const care='<p class="note">Stop and ease off if you feel pulling at the surgical site or hamstring tightness.</p>';
 if(run&&w){h+='<div class="target">'+w.t+(w.r?" | "+mmss(w.r[0])+"-"+mmss(w.r[1])+"/km":"")+"</div>";
  h+=day=="Tuesday"?li(["15 min easy warm-up with 4 x 15 sec relaxed strides"].concat(w.s,["10 min easy cool-down"])):li(["10 min warm-up"].concat(w.s,["Cool-down"]));h+=care}
 else if(run){const i=n<=8?0:n<=16?1:n<=23?2:n<=25?3:4;h+="<p>"+OUT[day=="Tuesday"?1:2][i]+"</p><p class=\"note\">Full session detail for this week is not built yet. Log your sessions and this week will be set from your results.</p>"}
 else if(day=="Sunday"){h+=n==26?"<p>Race week: no long run. A short easy shake-out is fine if you want one.</p>":'<div class="target">'+SUN[n-1]+" km easy</div>"+li(["Zone 2, by effort or heart rate, not pace","You should be able to speak in full sentences","Hills are fine: let the pace drop on the climbs"])}
 else{h+='<div class="target">'+(day=="Monday"?"Upper body":"Lower body")+"</div>"+li(LIFT[day])+'<p class="note">'+(DEL.includes(n)?"Deload week: drop one set from each lift and cut the load about 10%.":n>=17?"Race-specific phase: trim to maintenance volume (drop a set from each lift).":"Add 2.5-5% to a lift once every set is done at RPE 7 or below.")+(day=="Wednesday"?" Keep it moderate so Thursday stays fresh. No finisher and no Nordics.":" Stop each set 1-2 reps short of failure.")+"</p>"+care}
 out.innerHTML=h;sug.textContent="";
 $("cwrap").style.display=run?"":"none";$("twrap").style.display=$("swrap").style.display=day=="Thursday"?"":"none";
 cnt.value=w?w.n:(day=="Tuesday"?6:8);boxes()}
function logs(){try{return JSON.parse(localStorage.getItem("hxlog")||"[]")}catch(e){return[]}}
function put(a){try{localStorage.setItem("hxlog",JSON.stringify(a))}catch(e){}}
function resOf(l){return l.res||(l.sp.join(", ")+" | avg "+l.avg+" | fade "+l.fade+"s"+(l.t?" | total "+l.t:"")+(l.st?" | stations "+l.st:""))}
function draw(){const a=logs();$("log").innerHTML=a.length?"<tr><th>Wk</th><th>Day</th><th>Result</th><th>RPE</th><th>Notes</th></tr>"+a.map(l=>"<tr><td>"+l.n+"</td><td>"+l.day.slice(0,3)+"</td><td>"+esc(resOf(l))+"</td><td>"+l.e+"</td><td>"+esc(l.nt||"")+"</td></tr>").join(""):""}
$("save").onclick=()=>{const{n,day}=cur();const e=+$("rpe").value;const P=[...spl.children].map(d=>[d.querySelector("label").textContent,d.querySelector("input").value.trim()]);
 let res,m;
 if(day=="Sunday"){const km=parseFloat(P[0][1]),s=sec(P[1][1]);if(!km||s===null||!e){sug.textContent="Enter the distance, the pace as min:sec and an effort from 1 to 10.";return}
  res=km+"km @ "+P[1][1]+"/km"+(P[2][1]?" | HR "+P[2][1]:"");m=e>=7?"That was hard for an easy run: slow down next Sunday.":"Good, that’s the right effort for a Sunday run."}
 else if(LIFT[day]){const f=P.filter(x=>x[1]);if(!f.length||!e){sug.textContent="Enter at least one lift (for example 60kg 4x8) and an effort from 1 to 10.";return}
  res=f.map(x=>x[0]+" "+x[1]).join("; ");m=e<=7?"If every set felt controlled, add 2.5-5% to the main lifts next time.":"Hold the loads next time."}
 else{const raw=P.map(x=>x[1]).filter(Boolean),v=raw.map(sec);if(!raw.length||v.includes(null)||!e){sug.textContent="Enter each pace as min:sec (for example 4:31) and an effort from 1 to 10.";return}
  const avg=Math.round(v.reduce((a,b)=>a+b,0)/v.length),fade=v.length>1?v[v.length-1]-v[0]:0,fs=(fade>0?"+":"")+fade;
  res=raw.join(", ")+" | avg "+mmss(avg)+" | fade "+fs+"s"+($("tot").value?" | total "+$("tot").value:"")+($("st").value?" | stations "+$("st").value:"");
  const w=wk();m="Average "+mmss(avg)+", fastest "+mmss(Math.min(...v))+", slowest "+mmss(Math.max(...v))+", last vs first "+fs+" sec/km. ";
  if(w&&w.r)m+=avg<w.r[0]&&e<=7?"Faster than target at a manageable effort: tighten next week’s range by about 5 sec/km.":(avg>w.r[1]||e>=9)?"Slower than target or very hard: hold next week’s range, or ease it by about 5 sec/km.":"On target: progress as planned.";
  if(fade>=10)m+=" You faded: start the first runs at the slow end of the range."}
 const a=logs();a.push({n,day,res,e,nt:$("nt").value});put(a);draw();sug.textContent=m};
$("copy").onclick=()=>{const t=logs().map(l=>"Wk"+l.n+" "+l.day+": "+resOf(l)+" | RPE "+l.e+(l.nt?" | "+l.nt:"")).join("\n");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{window.prompt("Copy this log:",t)})};
$("clr").onclick=()=>{if(confirm("Clear all saved results?")){put([]);draw()}};
cnt.onchange=boxes;dsel.onchange=wsel.onchange=plan;plan();draw();
</script>
</body>
</html>
